<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basket — Shopping list</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="setup list-page">
    <header class="setup-header">
      <span class="step-badge">03</span>
      <h2>Shopping list</h2>
    </header>

    <div class="search-row">
      <div class="search-field">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18">
          <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input type="text" id="item-input" placeholder="Add an item">
      </div>
      <select id="store-select" class="store-select">
        <option value="X">Store X</option>
        <option value="Y">Store Y</option>
        <option value="Z">Store Z</option>
      </select>
    </div>

    <section class="list-section">
      <h3 class="list-section-title">Your list</h3>
      <p class="empty-state" id="empty-state">Nothing here yet — search above to add an item.</p>
      <ul class="item-list" id="item-list"></ul>
    </section>
  </div>

  <script src="js/list.js"></script>
</body>
</html>
