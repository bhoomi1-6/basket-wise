<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basket — Shop</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="setup shop-page">
    <header class="setup-header">
      <span class="step-badge">03</span>
      <h2>Shop</h2>
    </header>

    <div class="budget-bar">
      <div class="budget-bar-top">
        <span>Budget</span>
        <span id="budget-values">£0.00 / £0.00</span>
      </div>
      <div class="budget-track">
        <div class="budget-fill" id="budget-fill"></div>
      </div>
    </div>

    <div class="search-row">
      <div class="search-field-wrap">
        <div class="search-field">
          <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input type="text" id="search-input" placeholder="Search for an item" autocomplete="off">
          <button type="button" id="search-btn" class="search-btn" aria-label="Search">Go</button>
        </div>
        <ul class="suggestions" id="suggestions" style="display:none;"></ul>
      </div>
      <select id="retailer-select" class="store-select">
        <option value="All" selected>All</option>
        <option value="Tesco">Tesco</option>
        <option value="Sainsbury's">Sainsbury's</option>
        <option value="Aldi">Aldi</option>
      </select>
    </div>

    <section class="results-section" id="results-section" style="display:none;">
      <p class="results-message" id="results-message" style="display:none;"></p>
      <div class="pick-slot" id="top-pick-card"></div>
      <div class="alternatives" id="alternatives"></div>
    </section>

    <section class="list-section">
      <h3 class="list-section-title">Your list</h3>
      <p class="empty-state" id="empty-state">Nothing here yet — search above to add an item.</p>
      <ul class="item-list" id="item-list"></ul>
    </section>
  </div>

  <div class="toast" id="toast" style="display:none;"></div>

  <button type="button" class="meal-assistant-fab" id="meal-assistant-fab" aria-label="Open meal assistant">
    <svg viewBox="0 0 24 24" width="24" height="24">
      <path d="M12 2a1 1 0 0 1 1 1v2.06a5 5 0 0 1 4 4.94v1a2 2 0 0 1 2 2v1a1 1 0 0 1-1 1h-1.17A6 6 0 0 1 12 20a6 6 0 0 1-4.83-4H6a1 1 0 0 1-1-1v-1a2 2 0 0 1 2-2v-1a5 5 0 0 1 4-4.94V3a1 1 0 0 1 1-1Z" fill="currentColor"/>
    </svg>
  </button>

  <div class="meal-assistant-panel" id="meal-assistant-panel" style="display:none;">
    <div class="meal-assistant-header">
      <h3>Meal Assistant</h3>
      <button type="button" class="meal-assistant-close" id="meal-assistant-close" aria-label="Close meal assistant">×</button>
    </div>

    <label class="meal-plan-label" for="meal-plan-input">What are you cooking?</label>
    <div class="meal-plan-field">
      <input type="text" id="meal-plan-input" placeholder="e.g. vegetarian curry for 4" autocomplete="off">
      <button type="button" id="meal-plan-btn" class="btn-add">Generate list</button>
    </div>
    <p class="meal-plan-status" id="meal-plan-status" style="display:none;"></p>
    <div class="meal-plan-results" id="meal-plan-results"></div>
  </div>

  <script src="js/budget.js"></script>
  <script src="js/list.js"></script>
  <script src="js/search.js"></script>
  <script src="js/recommend.js"></script>
  <script src="js/meal-plan.js"></script>
</body>
</html>
